#NAME THE PIPELINE SAME AS FILE (WITHOUT ".yml")
# trigger:
# - main

resources:
  repositories:
    - repository: self
      trigger: none

variables:
  sampleRoot: '$(Build.SourcesDirectory)/EShopOnWebDN11'

stages:
- stage: Build
  displayName: Build .Net Core Solution
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    
    - checkout: self
      fetchDepth: 0
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        useGlobalJson: true
        workingDirectory: '$(sampleRoot)'
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: 'restore'
        projects: 'EShopOnWebDN11/eShopOnWeb.sln'
        feedsToUse: 'select'

    - task: SonarCloudPrepare@4
      inputs:
        SonarCloud: 'SonarSC'
        organization: 'Your Sonarcloud org'
        scannerMode: 'dotnet'
        projectKey: 'your sonarcloud project key'
        projectName: 'your sonarcloud project name'
    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: 'EShopOnWebDN11/eShopOnWeb.sln'
        arguments: '--configuration Release --no-restore'
    
    - task: DotNetCoreCLI@2
      displayName: Test
      inputs:
        command: 'test'
        projects: 'EShopOnWebDN11/eShopOnWeb.sln'
        arguments: '--configuration Release --no-build'
    
    - task: SonarCloudAnalyze@4
    
    - task: SonarCloudPublish@4
      inputs:
        pollingTimeoutSec: '300'
    
    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: |
          EShopOnWebDN11/src/Web/Web.csproj
          EShopOnWebDN11/src/ChatApi/ChatApi.csproj
        arguments: '--configuration Release --no-build -o $(Build.ArtifactStagingDirectory)'
    
    - task: PublishBuildArtifacts@1
      displayName: Publish Artifacts ADO - Website
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: Website
    
